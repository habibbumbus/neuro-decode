<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">NeuroDecode — From neural spikes to cursor velocity</title>
  <desc id="desc">A dark blue banner with a stylized spike raster, a decoder, and a two-dimensional velocity trace. This is a conceptual illustration, not measured data.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#091426"/>
      <stop offset="1" stop-color="#142b46"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8eb4d8" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect x="48" y="43" width="4" height="20" rx="2" fill="#55e6ce"/>
