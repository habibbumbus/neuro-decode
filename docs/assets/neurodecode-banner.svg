  <text x="45" y="130" fill="#f1f6ff" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">NeuroDecode</text>
  <text x="48" y="174" fill="#b8cee2" font-family="Arial, Helvetica, sans-serif" font-size="24">From neural spikes to cursor velocity.</text>
  <text x="48" y="220" fill="#91aac4" font-family="Arial, Helvetica, sans-serif" font-size="16">Ridge regression. Kalman filtering. A causal GRU.</text>
